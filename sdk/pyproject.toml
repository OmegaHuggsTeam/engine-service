[project]
name = "engine-sdk"
version = "0.1.0"
description = "Python SDK for Engine Service - HybridRAG + Multi-Agent Platform"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.26.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine_sdk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
