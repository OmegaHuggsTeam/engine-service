# Bunker Intelligence - SonarCloud Configuration
sonar.projectKey=bunker-intelligence
sonar.organization=bunker-intelligence
sonar.projectName=Bunker Intelligence

# Sources
sonar.sources=src,automation_hub,frontend/src
sonar.tests=tests,src/neural_link/tests

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/.venv/**,\
  **/db/**,\
  **/data/**,\
  **/__pycache__/**,\
  **/frontend/.next/**,\
  **/logs/**,\
  **/temp/**,\
  **/macros/**,\
  **/*.mcr

# Coverage
sonar.python.coverage.reportPaths=coverage.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Python
sonar.python.version=3.11,3.12

# Frontend
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
