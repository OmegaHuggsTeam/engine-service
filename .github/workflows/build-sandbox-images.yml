name: Build & Push Sandbox Images

on:
  push:
    branches: [main, develop]
    paths:
      - 'infra/sandbox-images/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'infra/sandbox-images/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/omegahuggsteam

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build Sandbox Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: sandbox-trigger
            context: infra/sandbox-images/trigger
          - name: sandbox-condition
            context: infra/sandbox-images/condition
          - name: sandbox-action
            context: infra/sandbox-images/action
          - name: sandbox-transform
            context: infra/sandbox-images/transform

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### ${{ matrix.image.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Push: \`${{ github.event_name != 'pull_request' }}\`" >> $GITHUB_STEP_SUMMARY
