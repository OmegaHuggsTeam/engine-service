# Secret templates - preencher antes do deploy
# Tailscale: kubectl create secret generic tailscale-auth -n bunker --from-literal=TS_AUTHKEY=tskey-xxx
---
# App secrets (Telegram, n8n)
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: bunker
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: ""
  AUTHORIZED_CHAT_ID: ""
  N8N_API_KEY: ""
  # URL base do n8n (cluster_health usa host:port/healthz)
  N8N_API_URL: "http://n8n:5678"
---
# Neo4j authentication
apiVersion: v1
kind: Secret
metadata:
  name: neo4j-auth
  namespace: bunker
type: Opaque
stringData:
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "neural_link_2024"
  NEO4J_AUTH: "neo4j/neural_link_2024"
