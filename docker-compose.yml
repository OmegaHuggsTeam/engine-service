# Bunker - Ecossistema Sentinela/Agentes
# docker-compose up -d

services:
  # VectorDB - ChromaDB para chunks n8n
  chroma:
    image: chromadb/chroma:latest
    container_name: bunker-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - bunker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # GraphDB - Neo4j para estrutura de grafos
  neo4j:
    image: neo4j:5-community
    container_name: bunker-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=neo4j/neural_link_2024
      - NEO4J_PLUGINS=["apoc"]
    networks:
      - bunker
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Evidence Server - FastAPI para fotos de evidência
  evidence:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bunker-evidence
    command: ["python", "-m", "uvicorn", "src.neural_link.services.evidence_server:app", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "5000:5000"
    volumes:
      - evidence_data:/app/temp/evidence
    environment:
      - EVIDENCE_DIR=/app/temp/evidence
      - EVIDENCE_SERVER_HOST=0.0.0.0
    networks:
      - bunker

  # Sovereign Gateway - API FastAPI na porta 8766 (Tailscale mesh)
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bunker-gateway
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neural_link_2024
      - EVIDENCE_SERVER_HOST=evidence
      - EVIDENCE_SERVER_PORT=5000
    command: ["python", "-m", "src.neural_link.api.sovereign_gateway"]
    ports:
      - "8766:8766"  # Expor para Tailscale mesh
    networks:
      - bunker
    depends_on:
      chroma:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  # App - Sentinela/Agentes (Telegram, SpecialistAgent, etc.)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bunker-app
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neural_link_2024
      - EVIDENCE_SERVER_HOST=evidence
      - EVIDENCE_SERVER_PORT=5000
      - EVIDENCE_DIR=/app/temp/evidence
    volumes:
      - evidence_data:/app/temp/evidence
    networks:
      - bunker
    depends_on:
      chroma:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

networks:
  bunker:
    driver: bridge

volumes:
  chroma_data:
  neo4j_data:
  evidence_data:
