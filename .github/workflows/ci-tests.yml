name: CI Tests

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black

      - name: Ruff lint
        run: ruff check src/ tests/ automation_hub/ || true

      - name: Black check
        run: black --check --diff src/ tests/ automation_hub/ || true

      - name: Run pytest with coverage
        run: |
          python -m pytest tests/ src/neural_link/tests/ \
            --cov=src --cov-report=xml --cov-report=term-missing \
            --tb=short -v --timeout=120 \
            --ignore=src/neural_link/tests/test_telegram_command_handler.py \
            --ignore=tests/integration/test_divine_inspiration_auto_invocation.py \
            --ignore=tests/integration/test_divine_inspiration_integration.py \
            --ignore=tests/unit/test_divine_inspiration.py \
            --ignore=tests/unit/test_steady_gaze_cdp.py \
            --ignore=tests/unit/test_selum_basic.py \
            --ignore=tests/sentinela/ \
            --ignore=tests/unit/test_delivery_email_hardware.py \
            --ignore=tests/test_maestro_service.py \
            --ignore=tests/integration/test_agent_factory_integration.py \
            --ignore=tests/integration/test_event_monitoring_integration.py \
            --ignore=tests/unit/test_manifest_loader.py \
            --ignore=src/neural_link/tests/test_jitbit_connector.py \
            -k "not selenium and not selum and not RealGrimoire"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
