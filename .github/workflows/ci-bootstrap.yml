name: CI Bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - 'run_init.py'
      - 'requirements*.txt'
      - '.github/workflows/ci-bootstrap.yml'
  pull_request:
    paths:
      - 'run_init.py'
      - 'requirements*.txt'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Copy .env.example to .env
        run: cp .env.example .env 2>/dev/null || echo "GROQ_API_KEY=test" > .env

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate core imports
        run: |
          python -c "from src.utils.llm_client import KeyManager; print('KeyManager OK')"
          python -c "from src.agents.agent_factory import AgentFactory; print('AgentFactory OK')"
          python -c "from src.neural_link.api.sovereign_gateway import app; print('Gateway OK')"

      - name: Basic run_init parsing
        run: |
          python -c "
          import ast
          with open('run_init.py') as f:
              ast.parse(f.read())
          print('run_init.py syntax OK')
          "
