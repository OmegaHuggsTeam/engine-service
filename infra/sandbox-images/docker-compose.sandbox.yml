version: "3.9"

# Sandbox Container Images — Build & Test
#
# Pull from ghcr.io (default):
#   docker compose -f docker-compose.sandbox.yml pull
#   docker compose -f docker-compose.sandbox.yml up --abort-on-container-exit
#
# Build locally (fallback):
#   SANDBOX_BUILD=1 docker compose -f docker-compose.sandbox.yml build
#   SANDBOX_BUILD=1 docker compose -f docker-compose.sandbox.yml up --abort-on-container-exit

x-sandbox-defaults: &sandbox-defaults
  read_only: true
  tmpfs:
    - /tmp:size=10M
  mem_limit: 128m
  cpus: 0.25
  security_opt:
    - no-new-privileges:true
  networks:
    - sandbox-net

services:
  trigger:
    <<: *sandbox-defaults
    image: ghcr.io/omegahuggsteam/sandbox-trigger:latest
    build:
      context: ./trigger
      dockerfile: Dockerfile
    container_name: sandbox-trigger-test
    environment:
      NODE_TYPE: trigger
      NODE_SUBTYPE: manual_trigger
      NODE_CONFIG: '{"source": "test"}'

  condition:
    <<: *sandbox-defaults
    image: ghcr.io/omegahuggsteam/sandbox-condition:latest
    build:
      context: ./condition
      dockerfile: Dockerfile
    container_name: sandbox-condition-test
    environment:
      NODE_TYPE: condition
      NODE_SUBTYPE: field_check
      NODE_CONFIG: '{"field": "score", "operator": "gte", "value": 50, "context": {"score": 75}}'

  action:
    <<: *sandbox-defaults
    image: ghcr.io/omegahuggsteam/sandbox-action:latest
    build:
      context: ./action
      dockerfile: Dockerfile
    container_name: sandbox-action-test
    environment:
      NODE_TYPE: action
      NODE_SUBTYPE: add_tag
      NODE_CONFIG: '{"payload": {"contact_id": "test-001", "tag": "vip"}}'
      CRM_API_URL: ""
      CRM_API_TOKEN: ""

  transform:
    <<: *sandbox-defaults
    image: ghcr.io/omegahuggsteam/sandbox-transform:latest
    build:
      context: ./transform
      dockerfile: Dockerfile
    container_name: sandbox-transform-test
    environment:
      NODE_TYPE: transform
      NODE_SUBTYPE: jmespath
      NODE_CONFIG: '{"expression": "contacts[?score > `50`].name", "data": {"contacts": [{"name": "Alice", "score": 80}, {"name": "Bob", "score": 30}]}}'

networks:
  sandbox-net:
    driver: bridge
    internal: true
