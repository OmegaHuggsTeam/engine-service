name: CD Deploy (VPS)

on:
  push:
    branches:
      - develop
      - main

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio ruff
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Tests
        run: |
          python -m pytest tests/ src/neural_link/tests/ \
            --tb=short -q \
            --ignore=src/neural_link/tests/test_telegram_command_handler.py
      - name: Docker compose validate
        run: docker compose config --quiet

  deploy-staging:
    name: Deploy Staging (Docker on VPS)
    needs: ci-gate
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd ${{ secrets.VPS_ENGINE_PATH || '/opt/engine-service' }}
            git pull origin develop
            docker compose build --no-cache gateway app
            docker compose up -d
            echo "Waiting for services..."
            sleep 20
            # Health check
            curl -sf http://localhost:8766/api/v1/cluster/health | python3 -c "
            import sys, json
            d = json.load(sys.stdin)
            ok = d['summary']['ok']
            total = d['summary']['total']
            fail = d['summary']['fail']
            print(f'Services: {ok}/{total} OK, {fail} failed')
            if fail > 0:
                sys.exit(1)
            " || echo "::warning::Some services unhealthy"
            echo "Deploy staging OK"

  deploy-production:
    name: Deploy Production (Docker on VPS)
    needs: ci-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd ${{ secrets.VPS_ENGINE_PATH || '/opt/engine-service' }}
            git pull origin main
            docker compose build --no-cache gateway app
            docker compose up -d
            sleep 20
            curl -sf http://localhost:8766/api/v1/cluster/health | python3 -c "
            import sys, json
            d = json.load(sys.stdin)
            ok = d['summary']['ok']
            fail = d['summary']['fail']
            print(f'Services: {ok}/{d[\"summary\"][\"total\"]} OK')
            if fail > 0:
                sys.exit(1)
            "
            echo "Deploy production OK"
