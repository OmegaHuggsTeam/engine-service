name: CI Docker Build

on:
  push:
    branches: [main, develop]
    paths:
      - 'Dockerfile'
      - 'requirements-docker.txt'
      - 'docker-compose.yml'
      - 'src/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Dockerfile'
      - 'requirements-docker.txt'
      - 'docker-compose.yml'
      - 'src/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose config
        run: docker compose config --quiet

      - name: Build app image
        run: docker build -t engine-service:ci-${{ github.sha }} .

      - name: Verify image runs
        run: |
          docker run --rm engine-service:ci-${{ github.sha }} python -c "
          from src.neural_link.api.sovereign_gateway import router
          print(f'Gateway OK: {len(router.routes)} routes')
          "

      - name: Image size report
        run: |
          SIZE=$(docker image inspect engine-service:ci-${{ github.sha }} --format '{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB}MB"
          echo "### Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "- Size: **${SIZE_MB}MB**" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: \`engine-service:ci-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
