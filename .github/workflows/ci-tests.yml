name: CI Tests

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black pytest pytest-cov pytest-asyncio

      - name: Ruff lint
        run: ruff check src/ tests/ automation_hub/ || true

      - name: Black check
        run: black --check --diff src/ tests/ automation_hub/ || true

      - name: Run pytest with coverage
        run: |
          python -m pytest tests/ src/neural_link/tests/ \
            --cov=src --cov-report=xml --cov-report=term-missing \
            --tb=short -v \
            --ignore=src/neural_link/tests/test_telegram_command_handler.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
