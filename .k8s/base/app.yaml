apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: bunker
  labels:
    app.kubernetes.io/name: app
  annotations:
    tailscale.com/hostname: n8n-bunker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
    spec:
      initContainers:
        - name: wait-chroma
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              until curl -sf http://chroma:8000/api/v2/heartbeat; do echo "waiting chroma..."; sleep 2; done
        - name: wait-neo4j
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              until curl -sf http://neo4j:7474; do echo "waiting neo4j..."; sleep 2; done
      containers:
        - name: app
          image: mcp-engine-service-app:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - src.neural_link.telemetry.telegram_command_handler
          env:
            - name: CHROMA_HOST
              value: chroma
            - name: CHROMA_PORT
              value: "8000"
            - name: NEO4J_URI
              value: bolt://neo4j:7687
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: neo4j-auth
                  key: NEO4J_USER
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neo4j-auth
                  key: NEO4J_PASSWORD
            - name: EVIDENCE_SERVER_HOST
              value: evidence
            - name: EVIDENCE_SERVER_PORT
              value: "5000"
            - name: EVIDENCE_DIR
              value: /app/temp/evidence
            - name: PYTHONPATH
              value: /app
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
            - name: N8N_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: N8N_API_KEY
                  optional: true
            - name: N8N_API_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: N8N_API_URL
                  optional: true
          volumeMounts:
            - name: evidence-data
              mountPath: /app/temp/evidence
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os, sys, httpx
                  h = os.getenv('CHROMA_HOST', 'chroma')
                  p = os.getenv('CHROMA_PORT', '8000')
                  r = httpx.get(f'http://{h}:{p}/api/v2/heartbeat', timeout=5)
                  sys.exit(0 if r.status_code == 200 else 1)
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
        # Tailscale Sidecar - n8n-bunker.tailscale.net (principal)
        - name: tailscale
          image: tailscale/tailscale:v1.64.1
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: TS_AUTHKEY
            - name: TS_EXTRA_ARGS
              value: "--accept-routes=false --advertise-exit-node=false --hostname=n8n-bunker --reset"
            - name: TS_USERSPACE
              value: "false"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - name: dev-tun
              mountPath: /dev/net/tun
            - name: ts-state
              mountPath: /var/lib/tailscale
      volumes:
        - name: evidence-data
          persistentVolumeClaim:
            claimName: evidence-data
        - name: ts-state
          emptyDir: {}
        - name: dev-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: bunker
  labels:
    app.kubernetes.io/name: app
spec:
  selector:
    app.kubernetes.io/name: app
  ports:
    - name: app
      port: 8080
      targetPort: 8080
  type: ClusterIP
