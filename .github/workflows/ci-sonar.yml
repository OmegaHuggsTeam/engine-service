name: CI SonarCloud

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          python -m pytest tests/ src/neural_link/tests/ \
            --cov=src --cov-report=xml --cov-report=term \
            --tb=short -q --timeout=120 \
            --ignore=src/neural_link/tests/test_telegram_command_handler.py \
            --ignore=tests/integration/test_divine_inspiration_auto_invocation.py \
            --ignore=tests/integration/test_divine_inspiration_integration.py \
            --ignore=tests/unit/test_divine_inspiration.py \
            --ignore=tests/unit/test_steady_gaze_cdp.py \
            --ignore=tests/unit/test_selum_basic.py \
            --ignore=tests/sentinela/ \
            --ignore=tests/unit/test_delivery_email_hardware.py \
            --ignore=tests/test_maestro_service.py \
            --ignore=tests/integration/test_agent_factory_integration.py \
            --ignore=tests/integration/test_event_monitoring_integration.py \
            --ignore=tests/unit/test_manifest_loader.py \
            --ignore=src/neural_link/tests/test_jitbit_connector.py \
            -k "not selenium and not selum and not RealGrimoire"

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
