apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bunker

resources:
  - ../../base

patches:
  # Disable K8s service-link env vars (CHROMA_PORT=tcp://... breaks config)
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/template/spec/enableServiceLinks
        value: false

  # Remove initContainers from app and gateway (race condition with Neo4j)
  - target:
      kind: Deployment
      name: app
    patch: |
      - op: remove
        path: /spec/template/spec/initContainers

  - target:
      kind: Deployment
      name: gateway
    patch: |
      - op: remove
        path: /spec/template/spec/initContainers

  # Patch ALL Tailscale sidecars: userspace mode + remove /dev/net/tun volume
  - target:
      kind: Deployment
      name: app
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
      spec:
        template:
          spec:
            containers:
              - name: tailscale
                env:
                  - name: TS_AUTHKEY
                    valueFrom:
                      secretKeyRef:
                        name: tailscale-auth
                        key: TS_AUTHKEY
                  - name: TS_EXTRA_ARGS
                    value: "--accept-routes=false --advertise-exit-node=false --hostname=n8n-bunker --reset"
                  - name: TS_USERSPACE
                    value: "true"
                  - name: TS_ACCEPT_DNS
                    value: "false"
                  - name: TS_KUBE_SECRET
                    value: ""
                  - name: TS_STATE_DIR
                    value: /var/lib/tailscale
                securityContext:
                  capabilities:
                    drop: ["ALL"]
                volumeMounts:
                  - name: ts-state
                    mountPath: /var/lib/tailscale
            volumes:
              - name: evidence-data
                persistentVolumeClaim:
                  claimName: evidence-data
              - name: ts-state
                emptyDir: {}

  - target:
      kind: Deployment
      name: gateway
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: gateway
      spec:
        template:
          spec:
            containers:
              - name: tailscale
                env:
                  - name: TS_AUTHKEY
                    valueFrom:
                      secretKeyRef:
                        name: tailscale-auth
                        key: TS_AUTHKEY
                  - name: TS_EXTRA_ARGS
                    value: "--accept-routes=false --advertise-exit-node=false --hostname=bunker-gateway --reset"
                  - name: TS_USERSPACE
                    value: "true"
                  - name: TS_ACCEPT_DNS
                    value: "false"
                  - name: TS_KUBE_SECRET
                    value: ""
                  - name: TS_STATE_DIR
                    value: /var/lib/tailscale
                securityContext:
                  capabilities:
                    drop: ["ALL"]
                volumeMounts:
                  - name: ts-state
                    mountPath: /var/lib/tailscale
            volumes:
              - name: ts-state
                emptyDir: {}

  - target:
      kind: Deployment
      name: neo4j
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: neo4j
      spec:
        template:
          spec:
            containers:
              - name: tailscale
                env:
                  - name: TS_AUTHKEY
                    valueFrom:
                      secretKeyRef:
                        name: tailscale-auth
                        key: TS_AUTHKEY
                  - name: TS_EXTRA_ARGS
                    value: "--accept-routes=false --advertise-exit-node=false --hostname=bunker-neo4j --reset"
                  - name: TS_USERSPACE
                    value: "true"
                  - name: TS_ACCEPT_DNS
                    value: "false"
                  - name: TS_KUBE_SECRET
                    value: ""
                  - name: TS_STATE_DIR
                    value: /var/lib/tailscale
                securityContext:
                  capabilities:
                    drop: ["ALL"]
                volumeMounts:
                  - name: ts-state
                    mountPath: /var/lib/tailscale
            volumes:
              - name: neo4j-data
                persistentVolumeClaim:
                  claimName: neo4j-data
              - name: ts-state
                emptyDir: {}

  - target:
      kind: Deployment
      name: chroma
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: chroma
      spec:
        template:
          spec:
            containers:
              - name: tailscale
                env:
                  - name: TS_AUTHKEY
                    valueFrom:
                      secretKeyRef:
                        name: tailscale-auth
                        key: TS_AUTHKEY
                  - name: TS_EXTRA_ARGS
                    value: "--accept-routes=false --advertise-exit-node=false --hostname=bunker-chroma --reset"
                  - name: TS_USERSPACE
                    value: "true"
                  - name: TS_ACCEPT_DNS
                    value: "false"
                  - name: TS_KUBE_SECRET
                    value: ""
                  - name: TS_STATE_DIR
                    value: /var/lib/tailscale
                securityContext:
                  capabilities:
                    drop: ["ALL"]
                volumeMounts:
                  - name: ts-state
                    mountPath: /var/lib/tailscale
            volumes:
              - name: chroma-data
                persistentVolumeClaim:
                  claimName: chroma-data
              - name: ts-state
                emptyDir: {}

  - target:
      kind: Deployment
      name: evidence-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: evidence-server
      spec:
        template:
          spec:
            containers:
              - name: tailscale
                env:
                  - name: TS_AUTHKEY
                    valueFrom:
                      secretKeyRef:
                        name: tailscale-auth
                        key: TS_AUTHKEY
                  - name: TS_EXTRA_ARGS
                    value: "--accept-routes=false --advertise-exit-node=false --hostname=bunker-evidence --reset"
                  - name: TS_USERSPACE
                    value: "true"
                  - name: TS_ACCEPT_DNS
                    value: "false"
                  - name: TS_KUBE_SECRET
                    value: ""
                  - name: TS_STATE_DIR
                    value: /var/lib/tailscale
                securityContext:
                  capabilities:
                    drop: ["ALL"]
                volumeMounts:
                  - name: ts-state
                    mountPath: /var/lib/tailscale
            volumes:
              - name: evidence-data
                persistentVolumeClaim:
                  claimName: evidence-data
              - name: ts-state
                emptyDir: {}
