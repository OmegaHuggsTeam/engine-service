# PersistentVolumeClaims para ChromaDB e Neo4j
# Garante persistência dos 435+ testes e chunks no restart dos pods
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-data
  namespace: bunker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: ""  # Usa default do cluster (K3s: local-path)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-data
  namespace: bunker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: ""
---
# Evidence Server - fotos de evidência
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evidence-data
  namespace: bunker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ""
